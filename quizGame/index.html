<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="screen active" id="start-screen"></div>
      <h1>Quiz Time</h1>
      <p>Test your knowledge with these fun questions</p>
      <button id="start-btn">Start Quiz</button>

      <div class="screen" id="quiz-screen">
        <div class="header">
          <h2 id="question-text">Question</h2>
          <!--esto se va actualizar con js-->
          <div class="quizz-info">
            <p>
              Question <span id="current-question">1</span> of <span>5</span>
            </p>

            <p>Score: <span id="score">0</span></p>
          </div>
        </div>
      </div>

      <div id="answers-container" class="answers-container">
        <!--Las respuestas se van a insertar aquí-->
      </div>

      <div class="progress-bar"></div>
    </div>
  </body>
</html>
